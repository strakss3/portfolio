<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan B. — Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #08080f;
            overflow-x: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        #contenu {
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 24px;
        }

        h1 {
            color: white;
            font-size: 48px;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        p.subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        nav button {
            background: rgba(255,255,255,0.06);
            border: 0.5px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        nav button:hover,
        nav button.active {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.5);
            color: white;
        }
    </style>
</head>
<body>

<div id="contenu">
    <header>
        <h1>Ethan B.</h1>
        <p class="subtitle">Developer &amp; Designer</p>
        <nav>
            <button data-shape="none"   class="active">Idle</button>
            <button data-shape="circle">About</button>
            <button data-shape="star">Projects</button>
            <button data-shape="wave">Skills</button>
            <button data-shape="grid">Contact</button>
        </nav>
    </header>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ─── Scène, caméra, renderer ─── */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080f);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* ─── Calcul des bords visibles ─── */

function getVisibleBounds(cam, depth) {
    const vFOV = (cam.fov * Math.PI) / 180;
    const height = 2 * Math.tan(vFOV / 2) * depth;
    const width  = height * cam.aspect;
    return { width, height };
}

let bounds = getVisibleBounds(camera, camera.position.z);

/* ─── Particules ─── */

const N = 600;
const positions = new Float32Array(N * 3);
const particlesData = [];

for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * bounds.width;
    const y = (Math.random() - 0.5) * bounds.height;
    const z = (Math.random() - 0.5) * 2;

    positions[i * 3]     = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    particlesData.push({
        vx:        (Math.random() - 0.5) * 0.006,
        vy:        -(Math.random() * 0.008 + 0.002),
        offset:    Math.random() * Math.PI * 2,
        amplitude: Math.random() * 0.006,
        tx: 0,
        ty: 0,
        forming: false
    });
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

/* ─── Couleurs par particule ─── */

const palette = [
    [0.55, 0.40, 1.00],
    [0.30, 0.55, 1.00],
    [1.00, 0.35, 0.65],
    [0.30, 0.85, 0.75],
    [1.00, 0.70, 0.25]
];

const colors = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i * 3]     = c[0];
    colors[i * 3 + 1] = c[1];
    colors[i * 3 + 2] = c[2];
}
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
    size:         0.07,
    vertexColors: true,
    transparent:  true,
    opacity:      0.85,
    sizeAttenuation: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

/* ─── Générateurs de formes ─── */

function getCircleTargets(n) {
    const out = [];
    const radius = Math.min(bounds.width, bounds.height) * 0.32;
    for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        out.push({
            x: Math.cos(angle) * radius + (Math.random() - 0.5) * 0.15,
            y: Math.sin(angle) * radius + (Math.random() - 0.5) * 0.15
        });
    }
    return out;
}

function getStarTargets(n) {
    const out = [];
    const r1 = Math.min(bounds.width, bounds.height) * 0.30;
    const r2 = r1 * 0.42;
    const branches = 5;
    for (let i = 0; i < n; i++) {
        const t     = i / n;
        const idx   = Math.floor(t * branches * 2);
        const frac  = (t * branches * 2) - idx;
        const aStart = (idx       / (branches * 2)) * Math.PI * 2 - Math.PI / 2;
        const aEnd   = ((idx + 1) / (branches * 2)) * Math.PI * 2 - Math.PI / 2;
        const rStart = idx % 2 === 0 ? r1 : r2;
        const rEnd   = idx % 2 === 0 ? r2 : r1;
        const curA   = aStart + frac * (aEnd - aStart);
        const curR   = rStart + frac * (rEnd - rStart);
        out.push({
            x: Math.cos(curA) * curR + (Math.random() - 0.5) * 0.12,
            y: Math.sin(curA) * curR + (Math.random() - 0.5) * 0.12
        });
    }
    return out;
}

function getWaveTargets(n) {
    const out = [];
    const halfW = bounds.width * 0.42;
    const amp   = bounds.height * 0.18;
    for (let i = 0; i < n; i++) {
        const t = i / n;
        out.push({
            x: (t - 0.5) * halfW * 2,
            y: Math.sin(t * Math.PI * 4) * amp + (Math.random() - 0.5) * 0.12
        });
    }
    return out;
}

function getGridTargets(n) {
    const out  = [];
    const cols = Math.ceil(Math.sqrt(n * 1.6));
    const rows = Math.ceil(n / cols);
    const gw   = bounds.width  * 0.55;
    const gh   = bounds.height * 0.50;
    const ox   = -gw / 2;
    const oy   = -gh / 2;
    for (let i = 0; i < n; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        out.push({
            x: ox + (col / (cols - 1)) * gw + (Math.random() - 0.5) * 0.08,
            y: oy + (row / (rows - 1)) * gh + (Math.random() - 0.5) * 0.08
        });
    }
    return out;
}

/* ─── Appliquer une forme ─── */

function setShape(shape) {
    let targets = [];

    if (shape === 'none') {
        particlesData.forEach(d => { d.forming = false; });
        return;
    }
    if (shape === 'circle') targets = getCircleTargets(N);
    if (shape === 'star')   targets = getStarTargets(N);
    if (shape === 'wave')   targets = getWaveTargets(N);
    if (shape === 'grid')   targets = getGridTargets(N);

    particlesData.forEach((d, i) => {
        d.tx      = targets[i].x;
        d.ty      = targets[i].y;
        d.forming = true;
    });
}

/* ─── Boutons ─── */

document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('mouseover', function () {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        setShape(this.dataset.shape);
    });
});

/* ─── Boucle d'animation ─── */

let t = 0;

function animate() {
    requestAnimationFrame(animate);
    t += 0.01;

    const halfH = bounds.height / 2;
    const halfW = bounds.width  / 2;

    for (let i = 0; i < N; i++) {
        const d  = particlesData[i];
        const ix = i * 3;
        const iy = i * 3 + 1;

        if (d.forming) {
            // Lerp vers la cible
            positions[ix] += (d.tx - positions[ix]) * 0.05;
            positions[iy] += (d.ty - positions[iy]) * 0.05;
        } else {
            // Dérive organique
            positions[ix] += d.vx + Math.sin(t + d.offset) * d.amplitude;
            positions[iy] += d.vy;

            // Recycler quand la particule sort des bords visibles
            if (positions[iy] < -halfH) {
                positions[iy] = halfH;
                positions[ix] = (Math.random() - 0.5) * bounds.width;
            }
            if (positions[ix] >  halfW) positions[ix] = -halfW;
            if (positions[ix] < -halfW) positions[ix] =  halfW;
        }
    }

    points.geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

animate();

/* ─── Resize ─── */

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    bounds = getVisibleBounds(camera, camera.position.z);
});
</script>

</body>
</html>
